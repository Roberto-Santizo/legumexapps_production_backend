        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyPlanEmployees]
      summary: Obtener empleado del plan
      responses:
        '200':
          description: Empleado del Plan Semanal Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanEmployee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [WeeklyPlanEmployees]
      summary: Actualizar empleado del plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanEmployeeInput' }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [WeeklyPlanEmployees]
      summary: Eliminar empleado del plan
      description: Falla con `400` si el empleado tiene asignaciones en tareas.
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── WEEKLY PLAN TASKS ─────────────────────────────
  /weekly-plan-tasks:
    get:
      tags: [WeeklyPlanTasks]
      summary: Listar tareas de planes semanales
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: weeklyPlanId, in: query, schema: { type: integer } }
        - { name: lineCode, in: query, schema: { type: string }, description: Código exacto de la línea }
        - { name: lineId, in: query, schema: { type: integer } }
        - { name: skuCode, in: query, schema: { type: string }, description: Filtro parcial por código de SKU }
        - { name: operationDate, in: query, schema: { type: string, format: date } }
        - { name: noOperationDate, in: query, schema: { type: boolean }, description: Solo tareas sin fecha de operación }
      responses:
        '200':
          description: Tareas del Plan Semanal Obtenidas Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTask' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTask' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [WeeklyPlanTasks]
      summary: Crear tarea de plan semanal
      description: '`pallets` y `hours` se calculan a partir del rendimiento y el SKU.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boxes, destination, operation_date, weekly_plan_id, line_sku_id]
              properties:
                boxes: { type: integer }
                destination: { type: string }
                operation_date: { type: string, format: date }
                weekly_plan_id: { type: integer }
                line_sku_id: { type: integer, description: ID del rendimiento (línea/SKU) }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/assignOperationDate:
    post:
      tags: [WeeklyPlanTasks]
      summary: Asignar fecha de operación a varias tareas
      description: Notifica por correo las tareas cuya fecha cambió.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasksIds, operation_date]
              properties:
                tasksIds: { type: array, minItems: 1, items: { type: integer } }
                operation_date: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/splitTask:
    post:
      tags: [WeeklyPlanTasks]
      summary: Dividir una tarea en porciones
      description: La suma de `boxes` de las porciones debe coincidir con las cajas de la tarea; no aplica a tareas iniciadas o con producción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, portions]
              properties:
                task_id: { type: integer }
                portions:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [boxes, operation_date]
                    properties:
                      boxes: { type: integer, minimum: 1 }
                      operation_date: { type: string, format: date }
      responses:
        '201':
          description: Tarea Dividida Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTask' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyPlanTasks]
      summary: Obtener tarea de plan semanal
      responses:
        '200':
          description: Tarea del Plan Semanal Obtenida Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [WeeklyPlanTasks]
      summary: Actualizar tarea de plan semanal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boxes, pallets, hours, destination, weekly_plan_id, line_sku_id]
              properties:
                boxes: { type: integer }
                produced_boxes: { type: [integer, 'null'] }
                pallets: { type: number }
                produced_pallets: { type: [number, 'null'] }
                hours: { type: number }
                weighed_pounds: { type: [number, 'null'] }
                destination: { type: string }
                operation_date: { type: [string, 'null'], format: date }
                start_date: { type: [string, 'null'], format: date-time }
                end_date: { type: [string, 'null'], format: date-time }
                weekly_plan_id: { type: integer }
                line_sku_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [WeeklyPlanTasks]
      summary: Eliminar tarea de plan semanal
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/packingMaterialItems:
    get:
      tags: [WeeklyPlanTasks]
      summary: Material de empaque requerido por la tarea
      description: Precarga para crear una transacción de material de empaque a partir de la receta del SKU.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Materiales de Empaque Obtenidos Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TaskPackingMaterialItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/start:
    post:
      tags: [WeeklyPlanTasks]
      summary: Iniciar tarea de plan semanal
      description: |
        Solo tareas en status `3` (Lista para ejecución). Registra `start_date` con la fecha/hora
        actual del servidor y pasa la tarea a status `4` (En Progreso). Sin body.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tarea Iniciada Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/end:
    post:
      tags: [WeeklyPlanTasks]
      summary: Finalizar tarea de plan semanal
      description: |
        Solo tareas en status `4` (En Progreso). Guarda `produced_boxes` y `weighed_pounds`,
        calcula `produced_pallets` = `produced_boxes / sku.boxes_per_pallet` (`0` si el SKU no
        tiene `boxes_per_pallet`), registra `end_date` con la fecha/hora actual del servidor y
        pasa la tarea a status `5` (Finalizada).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produced_boxes, weighed_pounds]
              properties:
                produced_boxes: { type: integer, minimum: 0 }
                weighed_pounds: { type: number, minimum: 0 }
      responses:
        '200':
          description: Tarea Finalizada Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── WEEKLY PLAN TASK EMPLOYEES ─────────────────────────────
  /weekly-plan-tasks/{id}/availableEmployees:
    get:
      tags: [WeeklyPlanTaskEmployees]
      summary: Empleados del plan disponibles para la tarea
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Candidatos Obtenidos Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanEmployee' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/employees:
    get:
      tags: [WeeklyPlanTaskEmployees]
      summary: Personal asignado a la tarea
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Personal Asignado Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTaskEmployee' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/confirmEmployees:
    post:
      tags: [WeeklyPlanTaskEmployees]
      summary: Confirmar asignación de personal de la tarea
      description: |
        Parte de los candidatos disponibles y aplica reemplazos, adiciones y remociones.
        Requiere tarea lista para confirmación y sin personal asignado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                replacements:
                  type: [array, 'null']
                  items:
                    type: object
                    required: [weekly_plan_employee_id, replacement_weekly_plan_employee_id]
                    properties:
                      weekly_plan_employee_id: { type: integer }
                      replacement_weekly_plan_employee_id: { type: integer }
                additions: { type: [array, 'null'], items: { type: integer }, description: IDs de weekly_plan_employees }
                removals: { type: [array, 'null'], items: { type: integer }, description: IDs de weekly_plan_employees }
      responses:
        '201': { $ref: '#/components/responses/NullData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-tasks/{id}/addEmployee:
    post:
      tags: [WeeklyPlanTaskEmployees]
      summary: Agregar empleado a la tarea
      description: Solo tareas listas para ejecución o en progreso; el empleado debe pertenecer al plan y no estar asignado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanEmployeeIdInput' }
      responses:
        '201': { $ref: '#/components/responses/NullData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-task-employees/{id}/replace:
    patch:
      tags: [WeeklyPlanTaskEmployees]
      summary: Reemplazar empleado de una asignación
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: ID de la asignación (weekly_plan_task_employees) }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanEmployeeIdInput' }
      responses:
        '200': { $ref: '#/components/responses/NullData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-task-employees/{id}:
    delete:
      tags: [WeeklyPlanTaskEmployees]
      summary: Retirar empleado de la tarea
      description: La tarea debe conservar al menos un empleado.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: ID de la asignación (weekly_plan_task_employees) }
      responses:
        '200': { $ref: '#/components/responses/NullData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── WEEKLY PLAN TASK OBSERVATIONS ─────────────────────────────
  /weekly-plan-task-observations:
    get:
      tags: [WeeklyPlanTaskObservations]
      summary: Listar observaciones de una tarea
      parameters:
        - { name: weeklyPlanTaskId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Observaciones Obtenidas Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTaskObservation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [WeeklyPlanTaskObservations]
      summary: Crear observación (autor = usuario autenticado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekly_plan_task_id, observation]
              properties:
                weekly_plan_task_id: { type: integer }
                observation: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-task-observations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyPlanTaskObservations]
      summary: Obtener observación
      responses:
        '200':
          description: Observación Obtenida Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTaskObservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [WeeklyPlanTaskObservations]
      summary: Actualizar observación (solo el autor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observation]
              properties:
                observation: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [WeeklyPlanTaskObservations]
      summary: Eliminar observación (solo el autor)
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── WEEKLY PLAN TASK PERFORMANCE RECORDS ─────────────────────────────
  /weekly-plan-task-performance-records:
    get:
      tags: [WeeklyPlanTaskPerformanceRecords]
      summary: Listar tomas de rendimiento de una tarea
      description: Ordenadas por fecha de registro (más antigua primero). Sin paginación.
      parameters:
        - { name: weeklyPlanTaskId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Tomas de Rendimiento Obtenidas Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WeeklyPlanTaskPerformanceRecord' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [WeeklyPlanTaskPerformanceRecords]
      summary: Registrar toma de rendimiento (registrador = usuario autenticado)
      description: |
        Solo tareas en status `4` (En Progreso). `pallet_number` y `boxes` son opcionales
        (SKUs no paletizados solo registran peso). `pallet_number` no puede repetirse en la misma tarea.

        El servidor calcula:
        - `theoretical_pounds` = `boxes × sku.presentation`
        - `difference_pounds` = `weighed_pounds − theoretical_pounds`

        Ambos quedan en `0` si no se envían `boxes` o el SKU no tiene `presentation`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanTaskPerformanceRecordInput' }
      responses:
        '201':
          description: Toma de Rendimiento Creada Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTaskPerformanceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weekly-plan-task-performance-records/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyPlanTaskPerformanceRecords]
      summary: Obtener toma de rendimiento
      responses:
        '200':
          description: Toma de Rendimiento Obtenida Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/WeeklyPlanTaskPerformanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [WeeklyPlanTaskPerformanceRecords]
      summary: Actualizar toma de rendimiento
      description: |
        Solo con la tarea en status `4`. Todos los campos son opcionales; los omitidos conservan su valor.
        Enviar `null` en `pallet_number` o `boxes` los limpia. `theoretical_pounds` y `difference_pounds`
        se recalculan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pallet_number: { type: [integer, 'null'], minimum: 1 }
                boxes: { type: [integer, 'null'], minimum: 0 }
                weighed_pounds: { type: number, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [WeeklyPlanTaskPerformanceRecords]
      summary: Eliminar toma de rendimiento
      description: Solo con la tarea en status `4`.
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /login`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: Código del registro (no el ID).
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1 }
      description: Si se envía, la respuesta es paginada con este tamaño de página.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Página a obtener (solo con `limit`).

  requestBodies:
    UploadFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary, description: 'Archivo Excel (xls o xlsx)' }

  responses:
    TrueData:
      description: Operación exitosa (`data` = true)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { const: true }
    NullData:
      description: Operación exitosa (`data` = null)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { type: 'null' }
    CreatedModel:
      description: Registro creado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Model' }
    UploadResult:
      description: Archivo Subido Correctamente
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data:
                    type: object
                    properties:
                      created: { type: integer, description: Registros creados }
    BadRequest:
      description: Error de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Acción no permitida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, examples: ['Token not provided'] }
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties: { type: array, items: { type: string } }
    ServerError:
      description: Error interno
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ApiError'
              - type: object
                properties:
                  message: { type: string }
    AdminForbidden:
      description: El usuario no tiene rol `admin` (No autorizado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    # ── Envolturas ──
    Envelope:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode: { type: integer, examples: [200] }
        message: { type: string }
        data: {}
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [total, currentPage, lastPage]
          properties:
            data: { type: array }
            total: { type: integer }
            currentPage: { type: integer }
            lastPage: { type: integer }
    ApiError:
      type: object
      properties:
        statusCode: { type: integer, examples: [404] }
        message: { type: string }
        data: { type: 'null' }
    Model:
      type: object
      description: Registro devuelto tal cual por Eloquent (columnas de la tabla en snake_case).
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    LabelValue:
      type: object
      properties:
        label: { type: string }
        value: { type: number }

    # ── Auth / Users ──
    Session:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        token: { type: string }
        permissions: { type: array, items: { type: string } }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        role: { type: string }
    UserInput:
      type: object
      required: [name, username, role, password]
      properties:
        name: { type: string, maxLength: 255 }
        username: { type: string, maxLength: 255, description: Único (solo validado al crear) }
        role: { type: string }
        password: { type: string, format: password, minLength: 8 }
    UserPermission:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        permission_id: { type: integer }
        permission: { type: string, description: Nombre del permiso }
    UserPermissionModel:
      allOf:
        - $ref: '#/components/schemas/Model'
        - type: object
          properties:
            user_id: { type: integer }
            permission_id: { type: integer }
    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    PermissionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255, description: Único }

    # ── Catálogos ──
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Line:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        shift: { type: integer }
    LineInput:
      type: object
      required: [name, code, shift]
      properties:
        name: { type: string }
        code: { type: string, description: Único }
        shift: { type: number }
    Position:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        activity: { type: string }
        line_id: { type: integer }
        line: { type: string, description: Nombre de la línea }
        status: { type: boolean }
    PositionInput:
      type: object
      required: [code, activity, line_id]
      properties:
        code: { type: string, maxLength: 255, description: Único }
        activity: { type: string, maxLength: 255 }
        line_id: { type: integer }
        status: { type: boolean }
    LineDependency:
      type: object
      properties:
        id: { type: integer }
        line_dependant_name: { type: string }
        positions: { type: integer, description: Cantidad de puestos de la línea dependiente }
    Client:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Timeout:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Sku:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        product_name: { type: string }
        presentation: { type: [number, 'null'], description: Libras por caja }
        boxes_per_pallet: { type: [integer, 'null'] }
        client: { type: string, description: Nombre del cliente }
        client_id: { type: integer }
    SkuInput:
      type: object
      required: [code, product_name, client_id]
      properties:
        code: { type: string, description: Único }
        product_name: { type: string }
        presentation: { type: [number, 'null'] }
        boxes_per_pallet: { type: [integer, 'null'] }
        client_id: { type: integer }
    LineSku:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string, description: Código del SKU }
        sku_id: { type: integer }
        line: { type: string, description: Nombre de la línea }
        line_id: { type: integer }
        lbs_performance: { type: number }
        accepted_percentage: { type: number }
        payment_method: { type: integer, enum: [0, 1] }
        status: { type: boolean }
    LineSkuInput:
      type: object
      required: [sku_id, line_id, lbs_performance, accepted_percentage, payment_method]
      properties:
        sku_id: { type: integer }
        line_id: { type: integer }
        lbs_performance: { type: number }
        accepted_percentage: { type: number }
        payment_method: { type: boolean }
    SkuPackingMaterial:
      type: object
      properties:
        id: { type: integer }
        lbs_per_item: { type: number }
        sku: { type: string, description: Código del SKU }
        sku_id: { type: integer }
        packing_material: { type: string }
        packing_material_code: { type: string }
        packing_material_id: { type: integer }
        created_at: { type: string, examples: ['01-10-2026 08:30:00 AM'] }
        updated_at: { type: string, examples: ['01-10-2026 08:30:00 AM'] }
    SkuPackingMaterialInput:
      type: object
      required: [lbs_per_item, sku_code, packing_material_id]
      properties:
        lbs_per_item: { type: number }
        sku_code: { type: string }
        packing_material_id: { type: integer }
    SkuRawMaterial:
      type: object
      properties:
        id: { type: integer }
        percentage: { type: number }
        sku: { type: string, description: Código del SKU }
        stock_keeping_unit_id: { type: integer }
        raw_material: { type: string }
        raw_material_id: { type: integer }
    SkuRawMaterialInput:
      type: object
      required: [percentage, stock_keeping_unit_code, raw_material_id]
      properties:
        percentage: { type: number }
        stock_keeping_unit_code: { type: string }
        raw_material_id: { type: integer }
    PackingMaterial:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        blocked: { type: boolean }
    PackingMaterialInput:
      type: object
      required: [name, description, code]
      properties:
        name: { type: string }
        description: { type: string }
        code: { type: string, description: Único }
        blocked: { type: [boolean, 'null'] }
    RawMaterial:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        product_name: { type: string }
    RawMaterialInput:
      type: object
      required: [code, product_name]
      properties:
        code: { type: string, description: Único }
        product_name: { type: string }

    # ── Bodega ──
    PackingMaterialTransaction:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string }
        responsable: { type: string }
        observations: { type: string }
        responsable_signature: { type: string, format: uri, description: URL pública en S3 }
        user_signature: { type: string, format: uri, description: URL pública en S3 }
        type: { type: integer }
        user_id: { type: integer }
        user_name: { type: string }
        weekly_plan_task_id: { type: [integer, 'null'] }
    PackingMaterialTransactionItem:
      type: object
      properties:
        id: { type: integer }
        quantity: { type: number }
        lote: { type: string }
        destination: { type: [string, 'null'] }
        packing_material_id: { type: integer }
        packing_material_name: { type: [string, 'null'] }
        packing_material_code: { type: [string, 'null'] }
        pm_transaction_id: { type: integer }
    PackingMaterialTransactionItemInput:
      type: object
      required: [quantity, lote, packing_material_id, pm_transaction_id]
      properties:
        quantity: { type: number }
        lote: { type: string }
        destination: { type: [string, 'null'] }
        packing_material_id: { type: integer }
        pm_transaction_id: { type: integer }

    # ── Planes ──
    WeekYearInput:
      type: object
      required: [week, year]
      properties:
        week: { type: integer }
        year: { type: integer }
    DraftWeeklyPlan:
      type: object
      properties:
        id: { type: integer }
        week: { type: integer }
        year: { type: integer }
        confirmation_date: { type: [string, 'null'], format: date-time }
    DraftWeeklyPlanTask:
      type: object
      properties:
        id: { type: integer }
        boxes: { type: integer }
        destination: { type: string }
        hours: { type: number }
        operation_date: { type: [string, 'null'], format: date }
        operation_date_string: { type: string, description: "`d-m-Y` o 'SIN PROGRAMACIÓN'" }
        draft_weekly_plan_id: { type: integer }
        sku_id: { type: integer }
        line_id: { type: [integer, 'null'] }
        sku_name: { type: string }
        sku_code: { type: string }
        line_name: { type: [string, 'null'] }
        line_code: { type: [string, 'null'] }
    DraftWeeklyPlanTaskInput:
      type: object
      required: [boxes, destination, draft_weekly_plan_id, sku_id]
      properties:
        boxes: { type: integer }
        destination: { type: string }
        operation_date: { type: [string, 'null'], format: date }
        draft_weekly_plan_id: { type: integer }
        sku_id: { type: integer }
        line_id: { type: [integer, 'null'] }
    WeeklyPlan:
      type: object
      properties:
        id: { type: integer }
        week: { type: integer }
        year: { type: integer }
    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string, examples: ['L01 | 12.5 h'] }
        date: { type: string, format: date }
        color: { type: string }
    LineSummary:
      type: object
      properties:
        line_id: { type: integer }
        line_code: { type: string }
        line_name: { type: string }
        total_tasks: { type: integer }
    WeeklyPlanEmployee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        position: { type: string, description: Código del puesto }
        biometric_position: { type: [string, 'null'], description: Puesto según el biométrico }
        position_id: { type: integer }
        employee_id: { type: integer }
    WeeklyPlanEmployeeInput:
      type: object
      required: [position_id, employee_id, weekly_plan_id]
      properties:
        position_id: { type: integer }
        employee_id: { type: integer }
        weekly_plan_id: { type: integer }
    WeeklyPlanEmployeeIdInput:
      type: object
      required: [weekly_plan_employee_id]
      properties:
        weekly_plan_employee_id: { type: integer }
    WeeklyPlanTask:
      type: object
      properties:
        id: { type: integer }
        boxes: { type: integer }
        produced_boxes: { type: [integer, 'null'] }
        pallets: { type: number }
        produced_pallets: { type: [number, 'null'] }
        hours: { type: number }
        weighed_pounds: { type: [number, 'null'] }
        recorded_pounds: { type: number, description: 'Suma de `weighed_pounds` de las tomas de rendimiento ("cuánto lleva")' }
        planned_pounds: { type: number, description: '`boxes × sku.presentation` ("cuánto es"); `0` si el SKU no tiene `presentation`' }
        destination: { type: string }
        operation_date: { type: [string, 'null'], format: date }
        operation_date_string: { type: string, description: "`d-m-Y` o 'SIN PROGRAMACIÓN'" }
        start_date: { type: [string, 'null'], description: '`Y-m-d H:i:s`; se registra con `POST …/start`' }
        end_date: { type: [string, 'null'], description: '`Y-m-d H:i:s`; se registra con `POST …/end`' }
        weekly_plan_id: { type: integer }
        line_sku_id: { type: integer }
        sku_name: { type: string }
        sku_code: { type: string }
        sku_client: { type: string }
        line_name: { type: string }
        line_code: { type: string }
        status:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: |
            1 = Pendiente Entrega Material de Empaque,
            2 = Lista para confirmación de asignaciónes,
            3 = Lista para ejecución,
            4 = En Progreso,
            5 = Finalizada
        status_message: { type: string }
    TaskPackingMaterialItem:
      type: object
      properties:
        quantity: { type: number, description: (cajas × presentación) / lbs_per_item }
        lote: { type: string, description: Siempre vacío }
        destination: { type: string, description: Nombre de la línea }
        packing_material_id: { type: integer }
        packing_material_name: { type: [string, 'null'] }
        packing_material_code: { type: [string, 'null'] }
        lbs_per_item: { type: number }
    WeeklyPlanTaskEmployee:
      type: object
      properties:
        id: { type: integer }
        weekly_plan_employee_id: { type: integer }
        name: { type: string }
        code: { type: string }
        position_id: { type: integer }
        position: { type: string, description: Código del puesto }
        replaced_weekly_plan_employee_id: { type: [integer, 'null'] }
        replaced_name: { type: [string, 'null'] }
        replaced_code: { type: [string, 'null'] }
    WeeklyPlanTaskObservation:
      type: object
      properties:
        id: { type: integer }
        weekly_plan_task_id: { type: integer }
        observation: { type: string }
        user_id: { type: integer }
        user_name: { type: string }
        created_at: { type: string, examples: ['01-10-2026 08:30'] }
        updated_at: { type: string, examples: ['01-10-2026 08:30'] }
        was_edited: { type: boolean }
    WeeklyPlanTaskPerformanceRecord:
      type: object
      properties:
        id: { type: integer }
        weekly_plan_task_id: { type: integer }
        pallet_number: { type: [integer, 'null'] }
        boxes: { type: [integer, 'null'] }
        weighed_pounds: { type: number, description: Peso real }
        theoretical_pounds: { type: number, description: '`boxes × sku.presentation`; `0` sin cajas o sin `presentation`' }
        difference_pounds: { type: number, description: '`weighed_pounds − theoretical_pounds`; `0` cuando no hay teórico' }
        user_id: { type: integer }
        user_name: { type: string }
        created_at: { type: string, examples: ['02-10-2026 08:30'] }
        updated_at: { type: string, examples: ['02-10-2026 08:30'] }
    WeeklyPlanTaskPerformanceRecordInput:
      type: object
      required: [weekly_plan_task_id, weighed_pounds]
      properties:
        weekly_plan_task_id: { type: integer }
        pallet_number: { type: [integer, 'null'], minimum: 1 }
        boxes: { type: [integer, 'null'], minimum: 0 }
        weighed_pounds: { type: number, minimum: 0 }
