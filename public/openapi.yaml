  /packing-material-transactions:
    get:
      tags: [PackingMaterialTransactions]
      summary: Listar transacciones de material de empaque
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: reference, in: query, schema: { type: string }, description: Filtro parcial por referencia }
        - { name: responsable, in: query, schema: { type: string }, description: Filtro parcial por responsable }
        - { name: type, in: query, schema: { type: integer }, description: Tipo de transacción }
      responses:
        '200':
          description: Transacciones de Material de Empaque Obtenidas Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/PackingMaterialTransaction' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/PackingMaterialTransaction' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [PackingMaterialTransactions]
      summary: Crear transacción de material de empaque con sus items
      description: Las firmas (PNG, máx. 1 MB) se suben a S3. `items` se envía como arreglo en el form-data (`items[0][quantity]`, ...).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reference, responsable, responsable_signature, user_signature, type, items]
              properties:
                reference: { type: string }
                responsable: { type: string }
                observations: { type: [string, 'null'] }
                responsable_signature: { type: string, format: binary, description: 'PNG, máx. 1024 KB' }
