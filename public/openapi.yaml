openapi: 3.1.0
info:
  title: Legumex Production API
  version: 1.0.0
  description: |
    API REST para planificación de producción: líneas, SKUs, materiales, planes semanales y tareas.

    **Formato de respuesta.** Toda respuesta de los controllers tiene la forma
    `{ statusCode, message, data }`. Los listados paginados (`?limit=`) agregan
    `total`, `currentPage` y `lastPage` al nivel raíz, junto a `data`.

    **Listados.** Con `?limit=N` la respuesta es paginada (usar `?page=` para navegar);
    sin `limit` se devuelve la colección completa.

    **Actualizaciones.** Todo `PUT /recurso/{id}` acepta también `PATCH` con el mismo cuerpo
    (rutas `apiResource`); la validación sigue exigiendo todos los campos requeridos.

    **Errores.**
    - `400` / `403` / `404` / `406`: errores de negocio (`{ statusCode, message, data: null }`).
    - `401`: token JWT ausente, inválido o expirado (`{ message }`).
    - `422`: error de validación de Laravel (`{ message, errors }`).
    - `500`: cualquier otra excepción.

    **Carga masiva.** Los endpoints `uploadFile` reciben un Excel (`xls`/`xlsx`); se validan
    todas las filas y, si alguna falla, se responde un único `400` con los errores por línea
    separados por salto de línea.
servers:
  - url: /api
    description: Servidor actual
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
    description: Solo administradores (`role = admin`).
  - name: UserPermissions
    description: Solo administradores (`role = admin`).
  - name: Permissions
    description: Solo administradores (`role = admin`).
  - name: Lines
  - name: Positions
  - name: LineDependencies
  - name: Clients
  - name: Skus
  - name: Performances
    description: Rendimientos (relación línea ↔ SKU).
  - name: SkuPackingMaterials
    description: Receta de material de empaque por SKU.
  - name: SkuRawMaterials
    description: Receta de materia prima por SKU.
  - name: PackingMaterials
  - name: RawMaterials
  - name: PackingMaterialTransactions
  - name: PackingMaterialTransactionItems
  - name: Timeouts
    description: Tiempos muertos.
  - name: DraftWeeklyPlans
  - name: DraftWeeklyPlanTasks
  - name: WeeklyPlans
  - name: WeeklyPlanEmployees
  - name: WeeklyPlanTasks
  - name: WeeklyPlanTaskEmployees
  - name: WeeklyPlanTaskObservations
  - name: WeeklyPlanTaskPerformanceRecords
    description: Tomas de rendimiento (pallet, cajas, libras) registradas durante una tarea en progreso.

paths:
  # ───────────────────────────── AUTH ─────────────────────────────
  /login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Sesión Iniciada Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Session' }
        '400':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /check-status:
    get:
      tags: [Auth]
      summary: Validar token y obtener sesión actual (refresca el token)
      responses:
        '200':
          description: Usuario Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── USERS ─────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: Listar usuarios
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: username, in: query, schema: { type: string }, description: Filtro parcial por username }
      responses:
        '200':
          description: Usuarios Obtenidos Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Users]
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201': { $ref: '#/components/responses/NullData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /users/{username}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string }, description: Username del usuario }
    get:
      tags: [Users]
      summary: Obtener usuario por username
      responses:
        '200':
          description: Usuario Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Users]
      summary: Actualizar usuario
      description: La contraseña siempre es requerida y se vuelve a encriptar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /users/getUserPermissions/{username}:
    get:
      tags: [Users]
      summary: Permisos asignados a un usuario
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Permisos Obtenidos Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UserPermission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── USER PERMISSIONS ─────────────────────────────
  /user-permissions:
    get:
      tags: [UserPermissions]
      summary: Listar permisos de un usuario
      parameters:
        - { name: userId, in: query, required: true, schema: { type: integer }, description: ID del usuario }
      responses:
        '200':
          description: Permisos Obtenidos Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UserPermissionModel' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [UserPermissions]
      summary: Asignar permiso a usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, permission_id]
              properties:
                user_id: { type: integer }
                permission_id: { type: integer }
      responses:
        '201':
          description: Permiso Agregado Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UserPermissionModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /user-permissions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [UserPermissions]
      summary: Obtener asignación de permiso
      responses:
        '200':
          description: Permiso Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UserPermissionModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [UserPermissions]
      summary: Quitar permiso a usuario
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── PERMISSIONS ─────────────────────────────
  /permissions:
    get:
      tags: [Permissions]
      summary: Listar permisos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Permisos Obtenidos Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Permission' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Permissions]
      summary: Crear permiso
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionInput' }
      responses:
        '201': { $ref: '#/components/responses/NullData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /permissions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Permissions]
      summary: Obtener permiso
      responses:
        '200':
          description: Permiso Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Model' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Permissions]
      summary: Actualizar permiso
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionInput' }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── LINES ─────────────────────────────
  /lines:
    get:
      tags: [Lines]
      summary: Listar líneas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: name, in: query, schema: { type: string }, description: Filtro parcial por nombre }
        - { name: code, in: query, schema: { type: string }, description: Filtro parcial por código }
        - { name: skuId, in: query, schema: { type: integer }, description: Solo líneas con rendimiento activo para este SKU }
      responses:
        '200':
          description: Líneas Obtenidas Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Line' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Line' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Lines]
      summary: Crear línea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /lines/uploadFile:
    post:
      tags: [Lines]
      summary: Carga masiva de líneas (Excel)
      requestBody: { $ref: '#/components/requestBodies/UploadFile' }
      responses:
        '200': { $ref: '#/components/responses/UploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /lines/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [Lines]
      summary: Obtener línea por código
      responses:
        '200':
          description: Línea Obtenida Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Line' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Lines]
      summary: Actualizar línea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Lines]
      summary: Eliminar línea
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── POSITIONS ─────────────────────────────
  /positions:
    get:
      tags: [Positions]
      summary: Listar puestos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: lineCode, in: query, schema: { type: string }, description: Código exacto de la línea }
        - { name: line, in: query, schema: { type: string }, description: Filtro parcial por nombre de línea }
        - { name: code, in: query, schema: { type: string }, description: Filtro parcial por código }
        - { name: activity, in: query, schema: { type: string }, description: Filtro parcial por actividad }
      responses:
        '200':
          description: Puestos Obtenidos Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Position' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Position' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Positions]
      summary: Crear puesto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /positions/uploadFile:
    post:
      tags: [Positions]
      summary: Carga masiva de puestos (Excel)
      requestBody: { $ref: '#/components/requestBodies/UploadFile' }
      responses:
        '200': { $ref: '#/components/responses/UploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /positions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Positions]
      summary: Obtener puesto
      responses:
        '200':
          description: Puesto Obtenido Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Positions]
      summary: Actualizar puesto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionInput' }
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Positions]
      summary: Eliminar puesto
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── LINE DEPENDENCIES ─────────────────────────────
  /line-dependencies:
    get:
      tags: [LineDependencies]
      summary: Listar dependencias de una línea
      parameters:
        - { name: lineId, in: query, required: true, schema: { type: integer }, description: ID de la línea }
      responses:
        '200':
          description: Dependencias Obtenidas Correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LineDependency' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [LineDependencies]
      summary: Crear dependencia entre líneas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line_id, line_dependent_id]
              properties:
                line_id: { type: integer }
                line_dependent_id: { type: integer, description: Debe ser distinta de `line_id` }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /line-dependencies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [LineDependencies]
      summary: Eliminar dependencia
      responses:
        '200': { $ref: '#/components/responses/TrueData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── CLIENTS ─────────────────────────────
  /clients:
    get:
      tags: [Clients]
      summary: Listar clientes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Page'
        - { name: name, in: query, schema: { type: string }, description: Filtro parcial por nombre }
      responses:
        '200':
          description: Clientes Obtenidos Correctamente
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/Envelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Client' } }
                  - allOf:
                      - $ref: '#/components/schemas/PaginatedEnvelope'
                      - properties:
                          data: { type: array, items: { $ref: '#/components/schemas/Client' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Clients]
      summary: Crear cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /clients/uploadFile:
    post:
      tags: [Clients]
      summary: Carga masiva de clientes (Excel)
      requestBody: { $ref: '#/components/requestBodies/UploadFile' }
      responses:
        '200': { $ref: '#/components/responses/UploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

